name: Daily AI Articles

# 每天定时抓取 AI 文章，生成 markdown 文档并提交回仓库
on:
  schedule:
    # cron 用的是 UTC 时间；01:23 UTC = 北京时间 09:23
    - cron: "23 1 * * *"
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: write          # 允许工作流把生成的文档 push 回仓库

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai     # 让 date 取北京时间，文件名按当天日期命名
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate article list
        run: |
          DATE=$(date +%F)
          mkdir -p articles
          python3 ai_articles.py --limit 30 --out "articles/${DATE}.md"
          cp "articles/${DATE}.md" articles/latest.md
          python3 build_readme.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ README.md
          if git diff --staged --quiet; then
            echo "今天没有新增内容，跳过提交"
          else
            git commit -m "chore: 更新 AI 文章列表 ($(date +%F))"
            git push
          fi
